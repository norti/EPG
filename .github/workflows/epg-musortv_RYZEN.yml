name: Automatic update - musor.tv (RYZEN)

on:
  schedule:
    # Minden szombat, hétfő és csütörtök reggel fut le
    - cron: "1 3 * * 4,6,1"
  workflow_dispatch: # Kézi indítási lehetőség a GitHub felületéről

jobs:
  grab-epg:
    runs-on: [self-hosted, Windows, X64]

    permissions:
      contents: write

    defaults:
      run:
        shell: powershell

    steps:
      - name: Repository klónozása
        uses: actions/checkout@v7

      - name: Node.js v24 beállítása
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: IPTV-org EPG repo letöltése
        run: |
          git clone https://github.com/iptv-org/epg.git iptv-epg
          Set-Location iptv-epg
          npm install

      - name: EPG adatok letöltése - musor.tv (14 nap)
        run: |
          New-Item -ItemType Directory -Force -Path temp_xml
          Copy-Item -Force epg-fix/musor.tv.config.js -Destination iptv-epg/sites/musor.tv/
          Set-Location iptv-epg
          npm run channels:parse --- --config=./sites/musor.tv/musor.tv.config.js --output=./sites/musor.tv/musor.tv.channels.xml
          npm run grab --- --sites=musor.tv --days=14 --maxConnections=1 --output=../temp_xml/musor_tv.xml

      - name: Fájl tömörítése GZ formátumba (7z)
        run: |
          New-Item -ItemType Directory -Force -Path EPG
          & "C:\Program Files\7-Zip\7z.exe" a -tgzip EPG/musor_tv.xml.gz .\temp_xml\musor_tv.xml

      - name: Frissített .gz fájl visszatöltése a repóba (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add EPG/*.gz
          $commitResult = git commit -m "Auto-update musor.tv EPG file [skip ci]" 2>&1
          if ($LASTEXITCODE -ne 0) {
              Write-Host "Nincs módosítás, amit commitolni kellene."
          } else {
              git push
          }
