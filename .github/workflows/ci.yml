name: "CI"

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  rust:
    name: Rust test & clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  js:
    name: JS tests, syntax & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JS unit tests
        run: |
          node tools/test-search.js
          node tools/test-trakt-dates.js

      - name: Check JS syntax (node --check)
        run: |
          find public/javascript tools -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run ESLint no-undef check
        run: npx --yes eslint@10 public/javascript tools
