[package]
name = "epg-viewer"
version = "1.0.0"
description = "EPG/XML TV Guide Viewer"
authors = ["norti"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
reqwest = { version = "0.11", features = ["gzip", "json"] }
zeroize = { version = "1.9", features = ["derive"] }
flate2 = "1.1"
encoding_rs = "0.8"
quick-xml = "0.31"
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5.0"
base64 = "0.22"
regex = "1.13"
open = "5"
sha2 = "0.10"
strsim = "0.11"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    "Win32_System_Memory",
] }
